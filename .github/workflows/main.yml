name: Stock Report

on:
  schedule:
    - cron: '0 9 * * 1-5'

  workflow_dispatch:

jobs:
  run-stock-report:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 라이브러리 설치
        run: |
          pip install pandas
          pip install pykrx
          pip install openpyxl

      - name: 실행
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}

        run: |
          python stock_report.py
