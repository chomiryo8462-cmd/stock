name: Stock Report

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    # 한국시간 오후 4시 30분 (UTC 07:30)
    - cron: '5 12 * * *'

jobs:
  run-stock-report:
    runs-on: ubuntu-latest

    steps:
      # 저장소 가져오기
      - name: 체크아웃
        uses: actions/checkout@v4

      # Python 설치
      - name: Python 설치
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # 패키지 설치
      - name: 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install pandas finance-datareader openpyxl beautifulsoup4 lxml requests

      # 주식 리포트 실행
      - name: 주식 리포트 실행
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}

        run: |
          python stock_report.py
