name: Stock Report

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: '20 13 * * *'

jobs:
  run-stock-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install pandas finance-datareader openpyxl beautifulsoup4 lxml requests

      - name: Run stock report
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: |
          python stock_report.py
