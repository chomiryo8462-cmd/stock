name: Stock Report

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: '10 13 * * *'

jobs:
  run-stock-report:
    runs-on: ubuntu-latest

    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install pandas finance-datareader openpyxl beautifulsoup4 lxml requests

      - name: 주식 리포트 실행
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: |
          python stock_report.py
